name: Yapay zekâ yorum kütüphaneleri

on:
  schedule:
    - cron: "41 3,11,19 * * *"   # Türkiye saatiyle 06:41, 14:41, 22:41 (tamamlanınca hiçbir şey yapmaz)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-commit
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r content-engine/requirements.txt
      - name: Eksik yorumları üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NATAL_MAX_REQUESTS: "30"
        run: |
          mkdir -p data/logs
          set -o pipefail
          python content-engine/library.py 2>&1 | tee data/logs/library-last.log
      - name: Kaydet
        if: always()
        run: |
          git config user.name "burc-bot"
          git config user.email "burc-bot@users.noreply.github.com"
          git add docs/v1 data/logs
          git diff --cached --quiet || (git commit -m "Yorum kütüphaneleri" && git pull --rebase && git push)
