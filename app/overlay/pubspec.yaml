name: gunluk_burc
description: Günlük burç yorumu ve motivasyon cümlesi, kilit ekranında.
publish_to: "none"
version: 1.2.1+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  in_app_purchase: ^3.2.0
  timezone: ^0.11.0
  path_drawing: ^1.0.1
  google_fonts: ^9.0.0
  # reklam: marka kampanyaları (video/görsel) + AdMob yedeği. Geniş aralık: kurulu Flutter'a uyan sürüm seçilir
  google_mobile_ads: ">=6.0.0 <10.0.0"
  video_player: ">=2.9.0 <3.0.0"
  url_launcher: ">=6.3.0 <7.0.0"
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ephem.bin
    - assets/places.json
